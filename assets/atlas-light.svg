<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：markdown/CSV/文本 → LayerDoc → 分层 SVG/HTML">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="190" x2="310" y2="190" marker-end="url(#ah-l)"/>
    <line x1="530" y1="190" x2="630" y2="190" marker-end="url(#ah-l)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="190" x2="306" y2="190" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="190" x2="626" y2="190" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M210,190 L306,190" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M530,190 L626,190" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-size="11" fill="#6E6E73" text-anchor="middle">
    <text x="258" y="178">parse · extract</text>
    <text x="578" y="178">render · diff</text>
  </g>
  <g>
    <rect x="40" y="150" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">markdown/CSV</text>
    <text x="125" y="206" text-anchor="middle" font-size="12" fill="#6E6E73">文本输入</text>
    <rect x="355" y="150" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#4B3FC4">LayerDoc</text>
    <text x="440" y="202" text-anchor="middle" font-size="12" fill="#6E6E73">可 diff 分层文档</text>
    <rect x="670" y="150" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#0B6B53">分层 SVG/HTML</text>
    <text x="755" y="202" text-anchor="middle" font-size="12" fill="#6E6E73">只重渲变化层</text>
  </g>
  <text x="440" y="312" text-anchor="middle" font-size="13" fill="#6E6E73">单 Python 进程 · 无 DB · PNG 由浏览器侧 canvas 完成</text>
</svg>
