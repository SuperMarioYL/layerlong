<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="演示：扁平 PNG 整张重画 vs 分层 SVG 只重渲一层">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFBFD"/>
      <stop offset="100%" stop-color="#F0F0F2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="url(#bg)"/>
  <text x="440" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1D1D1F">改一个数据 · before / after</text>

  <!-- ============ LEFT: 扁平 PNG（整张重画） ============ -->
  <g id="left-panel">
    <rect x="24" y="60" width="396" height="390" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5"/>
    <text x="42" y="92" font-size="15" font-weight="700" fill="#1D1D1F">扁平 PNG</text>
    <text x="42" y="110" font-size="11" fill="#6E6E73">改一个数据 → 整张重画</text>

    <!-- 三行内容（整张图被压平，改一处全闪） -->
    <g id="left-content">
      <g transform="translate(42,140)">
        <text x="0" y="20" font-size="12" fill="#6E6E73">月活用户</text>
        <rect x="0" y="30" width="300" height="14" rx="7" fill="#D1D1D6"/>
        <text x="300" y="20" text-anchor="end" font-size="13" font-weight="600" fill="#1D1D1F">1280 万</text>
      </g>
      <g transform="translate(42,220)">
        <text x="0" y="20" font-size="12" fill="#6E6E73">增长率</text>
        <rect x="0" y="30" width="170" height="14" rx="7" fill="#D1D1D6"/>
        <text x="300" y="20" text-anchor="end" font-size="13" font-weight="600" fill="#1D1D1F">23.5 %</text>
      </g>
      <g transform="translate(42,300)">
        <text x="0" y="20" font-size="12" fill="#6E6E73">留存率</text>
        <rect x="0" y="30" width="220" height="14" rx="7" fill="#D1D1D6"/>
        <text x="300" y="20" text-anchor="end" font-size="13" font-weight="600" fill="#1D1D1F">68 %</text>
      </g>
      <!-- 整张内容随 redraw 一起变暗再恢复 -->
      <animate attributeName="opacity" values="1;1;0.45;1;1" keyTimes="0;0.35;0.5;0.65;1" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- 整张闪烁覆盖层（红橙）= 整张重画 -->
    <rect x="24" y="60" width="396" height="390" rx="14" fill="#FF3B30" opacity="0">
      <animate attributeName="opacity" values="0;0;0.22;0;0" keyTimes="0;0.35;0.5;0.65;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <!-- "redraw 整张" 徽标 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.35;0.5;0.65;1" dur="3.6s" repeatCount="indefinite"/>
      <rect x="286" y="70" width="120" height="26" rx="13" fill="#FF3B30"/>
      <text x="346" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">redraw 整张</text>
    </g>
  </g>

  <!-- ============ RIGHT: 分层 SVG（只重渲一层） ============ -->
  <g id="right-panel">
    <rect x="460" y="60" width="396" height="390" rx="14" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1.5"/>
    <text x="478" y="92" font-size="15" font-weight="700" fill="#1D1D1F">分层 SVG</text>
    <text x="478" y="110" font-size="11" fill="#6E6E73">同改 → 只重渲变化层</text>

    <!-- layer-a（不变） -->
    <g id="layer-a" transform="translate(478,140)">
      <text x="0" y="20" font-size="12" fill="#6E6E73">月活用户</text>
      <rect x="0" y="30" width="300" height="14" rx="7" fill="#D1D1D6"/>
      <text x="300" y="20" text-anchor="end" font-size="13" font-weight="600" fill="#1D1D1F">1280 万</text>
    </g>

    <!-- layer-b（变化 → 只这一层高亮 + 重渲） -->
    <g id="layer-b" transform="translate(478,220)">
      <text x="0" y="20" font-size="12" fill="#6E6E73">增长率</text>
      <rect x="0" y="30" width="170" height="14" rx="7" fill="#0071E3">
        <animate attributeName="fill" values="#0071E3;#5E5CE6;#0071E3" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="300" y="20" text-anchor="end" font-size="13" font-weight="600" fill="#0071E3">23.5 %</text>
    </g>
    <!-- layer-b 高亮框（只有它变） -->
    <rect x="470" y="212" width="376" height="62" rx="8" fill="none" stroke="#FF9500" stroke-width="2.5" stroke-dasharray="6 4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.35;0.5;0.65;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- layer-c（不变） -->
    <g id="layer-c" transform="translate(478,300)">
      <text x="0" y="20" font-size="12" fill="#6E6E73">留存率</text>
      <rect x="0" y="30" width="220" height="14" rx="7" fill="#D1D1D6"/>
      <text x="300" y="20" text-anchor="end" font-size="13" font-weight="600" fill="#1D1D1F">68 %</text>
    </g>

    <!-- "1 layer changed" 徽标 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.35;0.5;0.65;1" dur="3.6s" repeatCount="indefinite"/>
      <rect x="706" y="70" width="138" height="26" rx="13" fill="#0071E3"/>
      <text x="775" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1 layer changed ✓</text>
    </g>
  </g>

  <!-- 图例 -->
  <text x="222" y="452" text-anchor="middle" font-size="12" fill="#6E6E73">扁平 PNG：改一处 = 整张闪烁重画</text>
  <text x="658" y="452" text-anchor="middle" font-size="12" fill="#6E6E73">分层 SVG：只变化图层高亮重渲</text>
</svg>
