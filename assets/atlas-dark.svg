<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：markdown/CSV/文本 → LayerDoc → 分层 SVG/HTML">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="190" x2="310" y2="190" marker-end="url(#ah-d)"/>
    <line x1="530" y1="190" x2="630" y2="190" marker-end="url(#ah-d)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="190" x2="306" y2="190" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="190" x2="626" y2="190" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M210,190 L306,190" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M530,190 L626,190" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-size="11" fill="#A1A1A8" text-anchor="middle">
    <text x="258" y="178">parse · extract</text>
    <text x="578" y="178">render · diff</text>
  </g>
  <g>
    <rect x="40" y="150" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#A9D2FF">markdown/CSV</text>
    <text x="125" y="206" text-anchor="middle" font-size="12" fill="#A1A1A8">文本输入</text>
    <rect x="355" y="150" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#C6C4FF">LayerDoc</text>
    <text x="440" y="202" text-anchor="middle" font-size="12" fill="#A1A1A8">可 diff 分层文档</text>
    <rect x="670" y="150" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#8FE6C5">分层 SVG/HTML</text>
    <text x="755" y="202" text-anchor="middle" font-size="12" fill="#A1A1A8">只重渲变化层</text>
  </g>
  <text x="440" y="312" text-anchor="middle" font-size="13" fill="#A1A1A8">单 Python 进程 · 无 DB · PNG 由浏览器侧 canvas 完成</text>
</svg>
