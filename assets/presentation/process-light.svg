<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="569ce6-706ae7-acebf6-730423704f0d" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">layerlong process</title><desc id="process-light-desc">The recorded result identifies the changed semantic layer while the other layers remain unchanged.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#4075ac"/><stop offset=".6" stop-color="#6863d8"/><stop offset="1" stop-color="#57777d"/></linearGradient><radialGradient id="halo"><stop stop-color="#4075ac" stop-opacity=".22"/><stop offset="1" stop-color="#f9fcfe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbe1f7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#4075ac" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#f9fcfe"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#556c88" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#131f30" font-size="30" text-anchor="start" font-weight="400">From input to a useful result</text><path d="M332.0 237H356.0" fill="none" stroke="#4075ac" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M332.0 237H356.0" class="flow" fill="none" stroke="#57777d" stroke-width="2"/><rect x="44.0" y="176" width="288.0" height="122" rx="12" fill="#f7fafe" stroke="#cbe1f7"/><text x="62.0" y="207.0" fill="#131f30" font-size="21" text-anchor="start" font-weight="400">01  Parse input</text><text x="62.0" y="259.0" fill="#556c88" font-size="17" text-anchor="start" font-weight="400">Bundled sample Markdown</text><path d="M644.0 237H668.0" fill="none" stroke="#4075ac" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M644.0 237H668.0" class="flow" fill="none" stroke="#57777d" stroke-width="2"/><rect x="356.0" y="176" width="288.0" height="122" rx="12" fill="#f7fafe" stroke="#cbe1f7"/><text x="374.0" y="207.0" fill="#131f30" font-size="21" text-anchor="start" font-weight="400">02  Edit one value</text><text x="374.0" y="259.0" fill="#556c88" font-size="17" text-anchor="start" font-weight="400">23.5 becomes 31.2</text><rect x="668.0" y="176" width="288.0" height="122" rx="12" fill="#f7fafe" stroke="#cbe1f7"/><text x="686.0" y="207.0" fill="#131f30" font-size="21" text-anchor="start" font-weight="400">03  Compare layers</text><text x="686.0" y="259.0" fill="#556c88" font-size="17" text-anchor="start" font-weight="400">Semantic IDs and SVG</text><text x="44" y="379.0" fill="#57777d" font-size="20" text-anchor="start" font-weight="400">The recorded result identifies the changed semantic layer while the other</text><text x="44" y="407.0" fill="#57777d" font-size="20" text-anchor="start" font-weight="400">layers remain unchanged.</text></svg>
